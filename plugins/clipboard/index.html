<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剪贴板</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="head">
      <div class="head-actions">
        <div class="tabs" role="tablist" aria-label="剪贴板分类">
          <button type="button" class="tab is-active" data-kind="all" role="tab" aria-selected="true">全部</button>
          <button type="button" class="tab" data-kind="text" role="tab" aria-selected="false">文本</button>
          <button type="button" class="tab" data-kind="image" role="tab" aria-selected="false">图片</button>
        </div>
        <button type="button" id="btn-clear" title="清空全部历史（含图片文件）">清空</button>
      </div>
    </header>

    <main id="list" class="list">
      <p class="empty">正在读取历史…</p>
    </main>

    <footer class="foot">
      <span>单击即复制</span>
      <span>Esc 退出</span>
      <span id="notice" class="notice"></span>
      <span id="count" class="count"></span>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
