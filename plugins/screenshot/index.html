<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZTools 截图</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="entry">
    <main class="card">
      <h1>截图</h1>
      <p id="status">正在准备…</p>
      <button id="retry" type="button">重新截图</button>
      <p class="note">
        进入后会立刻冻结屏幕并打开全屏选区窗口：拖动选择区域，再用工具条上的矩形 / 椭圆 /
        箭头 / 画笔 / 文本 / 马赛克标注；Enter 复制，Esc 取消。
      </p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
