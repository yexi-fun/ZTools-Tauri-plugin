<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZTools 截图</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="overlay">
    <canvas id="stage"></canvas>
    <input id="text-input" type="text" spellcheck="false" hidden />
    <div id="hint">悬停预选窗口 · 单击确认（桌面空白处选全屏）· 拖动自由框选 · Enter 复制 · Esc 取消</div>
    <div id="toolbar" hidden>
      <button type="button" class="sc-tool-button" data-tool="select" aria-label="选区" data-tooltip="选区"><span class="sc-icon sc-icon-select" aria-hidden="true"></span></button>
      <button type="button" class="sc-tool-button" data-tool="rect" aria-label="矩形" data-tooltip="矩形"><span class="sc-icon sc-icon-rect" aria-hidden="true"></span></button>
      <button type="button" class="sc-tool-button" data-tool="ellipse" aria-label="椭圆" data-tooltip="椭圆"><span class="sc-icon sc-icon-ellipse" aria-hidden="true"></span></button>
      <button type="button" class="sc-tool-button" data-tool="arrow" aria-label="箭头" data-tooltip="箭头"><span class="sc-icon sc-icon-arrow" aria-hidden="true"></span></button>
      <button type="button" class="sc-tool-button" data-tool="pen" aria-label="画笔" data-tooltip="画笔"><span class="sc-icon sc-icon-pen" aria-hidden="true"></span></button>
      <button type="button" class="sc-tool-button" data-tool="text" aria-label="文本" data-tooltip="文本"><span class="sc-icon sc-icon-text" aria-hidden="true"></span></button>
      <button type="button" class="sc-tool-button" data-tool="mosaic" aria-label="马赛克" data-tooltip="马赛克"><span class="sc-icon sc-icon-mosaic" aria-hidden="true"></span></button>
      <span class="sep"></span>
      <label class="toolbar-control color-control" data-tooltip="颜色" aria-label="颜色"><input id="color" type="color" value="#ff3b30" /></label>
      <label class="toolbar-control size-control" data-tooltip="线宽" aria-label="线宽"><input id="size" type="number" min="1" max="12" value="3" aria-label="线宽" /><span>px</span></label>
      <span class="sep"></span>
      <button type="button" id="undo" class="sc-tool-button" aria-label="撤销" data-tooltip="撤销"><span class="sc-icon sc-icon-undo" aria-hidden="true"></span></button>
      <button type="button" id="save" class="sc-tool-button" aria-label="保存" data-tooltip="保存"><span class="sc-icon sc-icon-save" aria-hidden="true"></span></button>
      <button type="button" id="pin" class="sc-tool-button" aria-label="钉住" data-tooltip="钉住（贴到桌面）" title="把选区钉在桌面上（可拖动 / 拖边缘缩放）"><span class="sc-icon sc-icon-pin" aria-hidden="true"></span></button>
      <button type="button" id="copy" class="sc-tool-button sc-confirm" aria-label="复制" data-tooltip="复制"><span class="sc-icon sc-icon-copy" aria-hidden="true"></span></button>
      <button type="button" id="cancel" class="sc-tool-button" aria-label="取消" data-tooltip="取消"><span class="sc-icon sc-icon-cancel" aria-hidden="true"></span></button>
    </div>
    <script type="module" src="./overlay.js"></script>
  </body>
</html>
