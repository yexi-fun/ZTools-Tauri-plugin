# 构建并发布插件：push 到 main 时，构建本次有改动的插件（首次发布全量），
# 把 `.zpx` 与市场清单（plugins.json / categories.json）作为 GitHub Release 资产上传。
#
# 与参考仓库 ZToolsCenter/ZTools-plugins 的流程一致，差异只有"产物格式"：
# 那边是 ZTools Electron 的插件 zip，这边是 ZTools-Tauri 的 `.zpx`。
#
# 手动全量重发：Actions → Build and Release Plugins → Run workflow（勾选 build_all）；
# 也可在 plugins 输入框里指定要单独构建的插件目录名。
name: Build and Release Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      plugins:
        description: '指定要构建的插件目录名，多个用逗号/空格分隔（留空=按变更检测）'
        required: false
        type: string
        default: ''
      build_all:
        description: '构建全部插件（而不是仅构建变动的插件）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 插件必须自带 SDK（别人的机器上宿主不提供 SDK 文件），仓库里已经提交了
      # `plugins/*/vendor/ztools-sdk/`。这一步只在能拿到 ZTools-Tauri 的 SDK 产物时做"刷新"，
      # 拿不到就沿用仓库内的副本——不能因为同步失败就让整条发布流程挂掉。
      - name: Sync plugin SDK
        run: |
          if [ -d "${{ github.workspace }}/../ZTools-Tauri/packages/ztools-sdk/dist" ]; then
            node scripts/sync-sdk.mjs --sdk "${{ github.workspace }}/../ZTools-Tauri/packages/ztools-sdk/dist"
          elif [ -n "${{ vars.ZTOOLS_SDK_DIST }}" ] && [ -d "${{ vars.ZTOOLS_SDK_DIST }}" ]; then
            node scripts/sync-sdk.mjs --sdk "${{ vars.ZTOOLS_SDK_DIST }}"
          else
            echo "未配置 SDK 来源，沿用仓库内已提交的 vendor/ztools-sdk（verify 会校验其存在）"
          fi

      # 源码级自检：清单规则、页面元素 id、分类映射（不含 release/ 产物）。
      - name: Verify plugin sources
        run: node scripts/verify.mjs --skip-release

      # 上一次发布的市场清单：合并时用它补齐"本次没有构建的插件"，
      # 否则只发变动插件会把其余插件从市场里挤掉。
      - name: Fetch previous market manifest
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          if gh release download --pattern plugins.json --dir release --clobber 2>/dev/null; then
            mv release/plugins.json release/plugins.previous.json
            # 增量发布只重建变动的插件，但合并后的市场清单仍会引用上一次的其它包；
            # 把历史 `.zpx` 一并取回，`verify.mjs` 才能逐条对上包（同名资产会被原样重传）。
            gh release download --pattern '*.zpx' --dir release --clobber 2>/dev/null || true
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "未找到历史 Release 清单（首次发布）"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed plugins
        id: detect
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; then
            node scripts/detect-changes.mjs --all
          elif [ -n "${{ inputs.plugins }}" ]; then
            node scripts/detect-changes.mjs --plugin "${{ inputs.plugins }}"
          else
            node scripts/detect-changes.mjs --base HEAD~1
          fi
          changed=$(node -e "console.log((require('./release/build-info.json').changedPlugins||[]).join(','))")
          # 首次发布（没有任何历史 Release）时，即使本次提交只改了 CI/脚本也要全量构建一次，
          # 否则仓库永远产不出第一个 Release。
          if [ -z "$changed" ] && [ "${{ steps.previous.outputs.found }}" = "false" ]; then
            echo "首次发布：改为全量构建"
            node scripts/detect-changes.mjs --all
            changed=$(node -e "console.log((require('./release/build-info.json').changedPlugins||[]).join(','))")
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "release_version=$(node -e "console.log(require('./release/build-info.json').releaseVersion)")" >> "$GITHUB_OUTPUT"
          echo "本次待构建：${changed:-（无）}"

      - name: Build .zpx packages
        if: steps.detect.outputs.changed != ''
        env:
          ZTOOLS_PLUGINS_REPO: ${{ github.repository }}
        run: node scripts/build-plugins.mjs

      - name: Generate market manifest
        if: steps.detect.outputs.changed != ''
        env:
          ZTOOLS_PLUGINS_REPO: ${{ github.repository }}
        run: node scripts/generate-plugins-json.mjs --release-version "${{ steps.detect.outputs.release_version }}"

      - name: Verify repository
        if: steps.detect.outputs.changed != ''
        run: node scripts/verify.mjs

      - name: Publish release
        if: steps.detect.outputs.changed != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.detect.outputs.release_version }}
          name: v${{ steps.detect.outputs.release_version }}
          body: |
            本次构建的插件：${{ steps.detect.outputs.changed }}

            下载 `*.zpx` 后在 ZTools-Tauri 的「设置 → 已安装插件」里填入路径即可安装；
            `plugins.json` 是市场清单（ZTools-Tauri 的插件市场直接读取它）。
          files: |
            release/*.zpx
            release/plugins.json
            release/categories.json
          fail_on_unmatched_files: true

      - name: Nothing to publish
        if: steps.detect.outputs.changed == ''
        run: echo "本次提交没有插件改动，跳过构建与发布"
